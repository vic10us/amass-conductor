{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "amass-conductor.fullname" . }}
  namespace: {{ .Values.rbac.engineNamespace }}
  labels:
    {{- include "amass-conductor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "amass-conductor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "amass-conductor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
